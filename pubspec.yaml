name: finan2
description: "Finanzas del hogar compartidas entre dos personas: transacciones, presupuesto, deudas, metas de ahorro e inversiones, con montos cifrados de extremo a extremo."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  cloud_firestore: ^6.6.0
  cryptography: ^2.7.0
  csv: ^8.0.0
  firebase_auth: ^6.5.4
  firebase_core: ^4.11.0
  firebase_messaging: ^16.0.4
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.0.1
  flutter_secure_storage: ^10.3.1
  http: ^1.5.0
  flutter_riverpod: ^3.3.2
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  intl: ^0.20.2
  pdf: ^3.13.0
  printing: ^5.15.0
  share_plus: ^13.2.0
  shared_preferences: ^2.5.5
  timezone: ^0.11.1
  web: ^1.1.1
  file_picker: ^13.1.0
  firebase_crashlytics: ^5.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  fake_cloud_firestore: ^4.1.1
  flutter_native_splash: ^2.4.8
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic-VariableFont_wght.ttf
          style: italic
