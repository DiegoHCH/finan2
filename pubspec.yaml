name: finan2
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cloud_firestore: ^6.6.0
  csv: ^8.0.0
  firebase_auth: ^6.5.4
  firebase_core: ^4.11.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.1
  flutter_riverpod: ^3.3.2
  flutter_timezone: ^5.1.0
  google_sign_in: ^7.2.0
  intl: ^0.20.3
  pdf: ^3.13.0
  printing: ^5.15.0
  share_plus: ^13.2.0
  shared_preferences: ^2.5.5
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  fake_cloud_firestore: ^4.1.1

flutter:
  uses-material-design: true

  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic-VariableFont_wght.ttf
          style: italic
