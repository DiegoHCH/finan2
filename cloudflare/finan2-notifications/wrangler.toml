name = "finan2-notifications"
main = "worker.js"
compatibility_date = "2026-01-01"
workers_dev = true

# Fires handleScheduled() in worker.js hourly, on the hour (UTC) - it checks
# each household's reminder prefs against the current Colombia-local time
# itself, so a coarser-than-exact cron is fine (see CO_UTC_OFFSET_HOURS).
[triggers]
crons = ["0 * * * *"]

# Per-uid cap on push relays (the fetch handler skips it if the binding is
# missing). Period must be 10 or 60 seconds.
[[ratelimits]]
name = "PUSH_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Secrets - set with wrangler secret put (never in this file):
#   wrangler secret put FIREBASE_SERVICE_ACCOUNT
#   wrangler secret put FIREBASE_PROJECT_ID
